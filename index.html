<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Banderas del Mundo (Offline)</title>
    <style>
        :root {
            /* Tema Oscuro */
            --bg-color: #121212;
            --text-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --input-border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; color: #f8fafc; }
        p.subtitle { color: #94a3b8; margin-bottom: 30px; }
        
        /* Contenedores */
        #menu-screen, #game-screen, #end-screen {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }
        #game-screen, #end-screen { display: none; }

        /* Botones del menú */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        /* Centrar Oceanía en su propia fila con el mismo tamaño */
        .btn-oceania {
            grid-column: span 2;
            justify-self: center;
            width: calc(50% - 7.5px);
        }
        .btn-world {
            grid-column: span 2;
            background-color: #10b981 !important;
        }
        .btn-world:hover { background-color: #059669 !important; }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        
        .btn-reset {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            margin-top: 25px;
            padding: 8px 15px;
            font-size: 13px;
        }
        .btn-reset:hover {
            background-color: #ef4444;
            color: white;
        }

        /* Área de juego */
        .progress-bar {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        img#flag-image {
            width: 100%;
            max-width: 320px;
            height: auto;
            border: 1px solid #334155;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            background-color: var(--input-bg);
            color: white;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .error-animation { animation: shake 0.4s; border-color: #ef4444 !important; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #feedback {
            height: 24px;
            margin-top: 10px;
            font-weight: bold;
            color: #ef4444;
            font-size: 18px;
        }
        .controls { margin-top: 20px; display: flex; justify-content: space-between; }
        .btn-skip { background-color: #f59e0b; }
        .btn-skip:hover { background-color: #d97706; }
        .btn-quit { background-color: #ef4444; }
        .btn-quit:hover { background-color: #dc2626; }
        .btn-continue { background-color: #10b981; width: 100%; }
        .btn-continue:hover { background-color: #059669; }

        /* Estilos del tiempo */
        .time-stats {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 15px;
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
            line-height: 1.6;
        }
    </style>
</head>

    <p class="subtitle">Escribe el nombre correcto. No importan los acentos.</p>

    <div id="menu-screen">
        <h2>Elige una región</h2>
        <div class="btn-grid">

            <button onclick="startGame('Europa')">Europa</button>
            <button onclick="startGame('Asia')">Asia</button>
            <button onclick="startGame('África')">África</button>
            <button class="btn-oceania" onclick="startGame('Oceanía')">Oceanía</button>
            <button class="btn-world" onclick="startGame('Mundo')">🌍 Mundo (50 banderas)</button>
        </div>
        <button class="btn-reset" onclick="resetRecords()">🗑️ Borrar Tiempos Guardados</button>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-screen">
        <div class="progress-bar" id="progress-text">1 de 35</div>
        <img id="flag-image" src="" alt="Bandera">
        <br>
        <input type="text" id="answer-input" placeholder="Escribe el país y presiona Enter" autocomplete="off">
        <div id="feedback"></div>
        
        <!-- Controles normales -->
        <div class="controls" id="normal-controls">
            <button class="btn-quit" onclick="showMenu()">Salir</button>
            <button class="btn-skip" onclick="skipFlag()">No me la sé</button>
        </div>

        <!-- Control de continuar (oculto por defecto) -->
        <div class="controls" id="continue-controls" style="display: none;">
            <button class="btn-continue" onclick="nextFlag()">Continuar ➡️</button>
        </div>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="end-screen">
        <h2>¡Juego Terminado! 🎉</h2>
        <p>Has completado el reto de <span id="end-region" style="font-weight: bold; color: var(--primary);"></span>.</p>

        <button onclick="showMenu()" style="margin-top: 20px; width: 100%;">Volver al Menú</button>
    </div>

        // NORMALIZAR TEXTO
        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/&/g, "y")
                .trim();
        }

        // DESORDENAR ARREGLO
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // FORMATEAR TIEMPO (ej. 125s -> "02:05")
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // INICIAR JUEGO
        function startGame(region) {
            currentRegion = region;
            
            if (region === 'Mundo') {
                currentPlaylist = shuffleArray(countries).slice(0, 50);
            } else {
                let filtered = countries.filter(c => c.continent === region);
                currentPlaylist = shuffleArray(filtered);
            }

            currentIndex = 0;
            score = 0;
            startTime = Date.now();
            
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            loadFlag();
        }

            if (currentIndex >= currentPlaylist.length) {

                return;
            }

            document.getElementById('flag-image').alt = `Bandera de ${country.code}`;
            
            document.getElementById('progress-text').innerText = `${currentIndex + 1} de ${currentPlaylist.length}`;
            
            const input = document.getElementById('answer-input');
            input.value = '';
            input.disabled = false;
            input.focus();
            
            document.getElementById('feedback').innerText = '';
            document.getElementById('normal-controls').style.display = 'flex';
            document.getElementById('continue-controls').style.display = 'none';
        }

        // SALTAR BANDERA
        function skipFlag() {
            const country = currentPlaylist[currentIndex];
            const feedback = document.getElementById('feedback');
            
            feedback.style.color = '#f59e0b';
            feedback.innerText = `Era: ${country.names[0]}`;
            
            document.getElementById('answer-input').disabled = true;
            document.getElementById('normal-controls').style.display = 'none';
            document.getElementById('continue-controls').style.display = 'flex';
        }

        // CONTINUAR DESPUÉS DE SALTAR
        function nextFlag() {
            currentIndex++;
            loadFlag();
        }

        // MOSTRAR MENÚ PRINCIPAL
        function showMenu() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        // TERMINAR JUEGO Y CALCULAR TIEMPOS
        function endGame() {
            const endTime = Date.now();
            const timeTakenSec = Math.floor((endTime - startTime) / 1000);
            const isPerfect = (score === currentPlaylist.length);
            
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('end-region').innerText = currentRegion;
            document.getElementById('score-text').innerText = `${score} de ${currentPlaylist.length}`;

            const storageKey = `bestTime_${currentRegion}`;
            let bestTimeSec = localStorage.getItem(storageKey);
            let isNewRecord = false;

            // Guardar récord si es puntaje perfecto
            if (isPerfect) {
                if (!bestTimeSec || timeTakenSec < parseInt(bestTimeSec)) {
                    localStorage.setItem(storageKey, timeTakenSec);
                    bestTimeSec = timeTakenSec;
                    isNewRecord = true;
                }
            }

            // Construir el mensaje explicativo
            const timeDisplay = document.getElementById('time-display');
            let statusText = "";

            if (isPerfect) {
                statusText = `<br>Mejor tiempo perfecto (${currentRegion}): <strong style="color: #10b981;">${formatTime(bestTimeSec)}</strong> ${isNewRecord ? '🎉 ¡Nuevo récord!' : ''}`;
            } else {
                if (bestTimeSec) {
                    statusText = `<br>Mejor tiempo registrado: <strong style="color: #10b981;">${formatTime(bestTimeSec)}</strong>`;
                }
                statusText += `<br><span style="color: #ef4444; font-size: 13px; font-weight: bold;">⚠️ Necesitas 100% de aciertos para registrar o actualizar tu récord.</span>`;
            }

            timeDisplay.innerHTML = `Tiempo total: <strong style="color: white;">${formatTime(timeTakenSec)}</strong>${statusText}`;
        }

        // REINICIAR/BORRAR RÉCORDS
        function resetRecords() {
            if (confirm("¿Estás seguro de que quieres borrar todos tus mejores tiempos guardados?")) {
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('bestTime_')) {
                        localStorage.removeItem(key);
                    }
                });
                alert("¡Todos los tiempos han sido borrados con éxito!");
            }
        }

        // REVISAR RESPUESTA AL PRESIONAR ENTER
        document.getElementById('answer-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !this.disabled) {
                const userInput = normalizeText(this.value);
                const country = currentPlaylist[currentIndex];
                
                const isCorrect = country.names.some(name => normalizeText(name) === userInput);

                if (isCorrect) {
                    score++;
                    currentIndex++;
                    loadFlag();
                } else {
                    this.classList.remove('error-animation');
                    void this.offsetWidth;
                    this.classList.add('error-animation');
                    
                    const feedback = document.getElementById('feedback');
                    feedback.style.color = '#ef4444';
                    feedback.innerText = 'Incorrecto, intenta de nuevo.';
                    
                    setTimeout(() => {
                        if(feedback.style.color === 'rgb(239, 68, 68)') {
                            feedback.innerText = '';
                        }
                        this.classList.remove('error-animation');
                    }, 1500);
                }
            }
        });
    </script>
</body>
</html>
